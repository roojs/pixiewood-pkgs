name: Test

on:
  push:
  pull_request:

jobs:
  sysroot-helpers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Pack, activate, and stage a fake sysroot
        run: bash tests/test-sysroot-tree.sh

      - name: Check wrap pins and the Meson wrapper
        run: bash tests/test-pins-and-wrapper.sh

      - name: Check the Pixiewood patch applies
        run: bash tests/test-pixiewood-patch.sh

      - name: Check the package index and GTK targets
        run: bash tests/test-index.sh

      - name: Check the one-package proof plan
        run: bash tests/test-prove-package.sh

      - name: Check pin, cache, and checkout reuse
        run: |
          bash tests/test-obtain-package.sh
          bash tests/test-checkout-cache.sh
          bash tests/test-packaged-deps.sh
          bash tests/test-list-package-cache.sh
