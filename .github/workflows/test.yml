name: Test

on:
  push:
  pull_request:

jobs:
  pixie-helpers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check wrap pins
        run: bash tests/test-pins-and-wrapper.sh

      - name: Check wrap version updates
        run: bash tests/test-update-wraps.sh

      - name: Check the package index
        run: bash tests/test-index.sh

      - name: Check the changelog release
        run: bash tests/test-release.sh

      - name: Check the one-package proof plan
        run: bash tests/test-prove-package.sh

      - name: Check pin, cache, and checkout reuse
        run: |
          bash tests/test-obtain-package.sh
          bash tests/test-checkout-cache.sh
          bash tests/test-packaged-deps.sh
          bash tests/test-list-package-cache.sh
          bash tests/test-library-options.sh
          bash tests/test-place-upstream-plans.sh
          bash tests/test-publish-package.sh
