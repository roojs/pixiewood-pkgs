name: Build Android sysroot

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Android arch (aarch64 or x86_64)
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64
      gtk:
        description: GTK target from packages/gtk/targets. Default gnome. A branch target is owner.branch, for example Knowles.android-ime.
        type: string
        default: gnome

jobs:
  sysroot:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - name: Restore package cache and checkouts
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/packages
            .cache/checkouts
          key: packages-${{ inputs.arch || 'aarch64' }}-${{ github.run_id }}
          restore-keys: |
            packages-${{ inputs.arch || 'aarch64' }}-

      - name: List restored packages
        env:
          CACHE_HIT: ${{ steps.packages.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.packages.outputs.cache-matched-key }}
        run: |
          echo "cache-hit=${CACHE_HIT:-false}"
          echo "cache-matched-key=${CACHE_MATCHED_KEY:-none}"
          scripts/list-package-cache.sh

      - name: Install host packages
        run: scripts/ci-host-setup.sh

      - name: Build sysroot tarball
        env:
          ARCH: ${{ inputs.arch || 'aarch64' }}
          GTK_TARGET: ${{ inputs.gtk || 'gnome' }}
        run: scripts/build-sysroot.sh --arch "$ARCH" --gtk "$GTK_TARGET"

      - name: Save package cache and checkouts
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/packages
            .cache/checkouts
          key: packages-${{ inputs.arch || 'aarch64' }}-${{ github.run_id }}

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: pixiewood-android-${{ inputs.gtk || 'gnome' }}-${{ inputs.arch || 'aarch64' }}
          path: out/*.tar.xz
          if-no-files-found: error
