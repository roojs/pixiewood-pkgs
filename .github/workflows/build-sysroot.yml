name: Build Android sysroot

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Android arch (aarch64 or x86_64)
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64
      gtk:
        description: GTK target. gnome is native GTK with no Android patch. ime is Knowles/gtk android-ime.
        type: choice
        options:
          - gnome
          - ime
        default: gnome

jobs:
  sysroot:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - name: Install host packages
        run: scripts/ci-host-setup.sh

      - name: Build sysroot tarball
        env:
          ARCH: ${{ inputs.arch || 'aarch64' }}
          GTK_TARGET: ${{ inputs.gtk || 'gnome' }}
        run: scripts/build-sysroot.sh --arch "$ARCH" --gtk "$GTK_TARGET"

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: pixiewood-android-${{ inputs.gtk || 'gnome' }}-${{ inputs.arch || 'aarch64' }}
          path: out/*.tar.xz
          if-no-files-found: error
