name: Build Android sysroot

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      arch:
        description: Android arch (aarch64 or x86_64)
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64

permissions:
  contents: write

concurrency:
  group: android-sysroot-${{ github.ref }}-${{ inputs.arch || 'aarch64' }}
  cancel-in-progress: false

jobs:
  sysroot:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      # python3 runs GLib's glib-mkenums and the OpenSSL wrap generator.
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            flex \
            bison \
            gettext \
            git \
            glslc \
            gperf \
            libtext-template-perl \
            meson \
            nasm \
            ninja-build \
            pkg-config \
            python3 \
            python3-packaging \
            sassc \
            unzip \
            valac

      - name: Ensure Meson 1.8 or newer
        run: |
          set -euo pipefail
          version_ge() {
            [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | tail -n1)" = "$1" ]
          }
          if command -v meson >/dev/null 2>&1 && version_ge "$(meson --version)" 1.8.0; then
            echo "Using $(command -v meson) $(meson --version)"
            exit 0
          fi
          tools="$RUNNER_TEMP/meson"
          pool="https://deb.debian.org/debian/pool/main/m/meson"
          deb="$(curl -fsSL "$pool/" \
            | grep -oE 'href="meson_[^"]+_all\.deb"' \
            | sed 's/^href="//;s/"$//' \
            | sort -V \
            | tail -n1)"
          if [ -z "$deb" ]; then
            echo "Could not find a meson deb under $pool" >&2
            exit 1
          fi
          tmp="$(mktemp -d)"
          curl -fsSL "$pool/$deb" -o "$tmp/meson.deb"
          mkdir -p "$tools/root" "$tools/bin"
          dpkg-deb -x "$tmp/meson.deb" "$tools/root"
          real="$tools/root/usr/bin/meson"
          mv "$real" "$real.real"
          printf '%s\n' \
            '#!/bin/sh' \
            "export PYTHONPATH=\"$tools/root/usr/lib/python3/dist-packages\${PYTHONPATH:+:\$PYTHONPATH}\"" \
            "exec python3 \"$real.real\" \"\$@\"" \
            > "$real"
          chmod +x "$real" "$real.real"
          ln -sf "$real" "$tools/bin/meson"
          echo "$tools/bin" >> "$GITHUB_PATH"
          "$tools/bin/meson" --version

      - name: Build sysroot tarball
        env:
          ARCH: ${{ inputs.arch || 'aarch64' }}
        run: scripts/build-sysroot.sh --arch "$ARCH"

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: pixiewood-android-sysroot-${{ inputs.arch || 'aarch64' }}
          path: out/*.tar.xz
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ inputs.arch || 'aarch64' }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < stack/ollmchat/VERSION)"
          tag="v${version}"
          title="pixiewood-android-sysroot ${version}"
          notes="Prebuilt Android sysroot (${ARCH}) for the ollmchat profile."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.tar.xz --clobber
          else
            gh release create "$tag" out/*.tar.xz --title "$title" --notes "$notes"
          fi
