name: Prove package

on:
  workflow_dispatch:
    inputs:
      through:
        description: Last package to prove, from the start of build-order.txt. Each finished package is published before the next one starts. A later failure leaves those packages on the release.
        type: string
        default: glib-networking
      packages:
        description: Explicit package list instead of through. Leave empty to use through.
        type: string
        default: ""
      arch:
        description: Android arch
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: write
      contents: write
    outputs:
      pages: ${{ steps.page.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use the published pin lists
        run: scripts/pins-page.sh fetch

      - name: Restore package cache and checkouts
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/packages
            .cache/checkouts
          key: packages-${{ inputs.arch || 'aarch64' }}-${{ github.run_id }}
          restore-keys: |
            packages-${{ inputs.arch || 'aarch64' }}-

      - name: List restored packages
        env:
          CACHE_HIT: ${{ steps.packages.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.packages.outputs.cache-matched-key }}
        run: |
          echo "cache-hit=${CACHE_HIT:-false}"
          echo "cache-matched-key=${CACHE_MATCHED_KEY:-none}"
          scripts/list-package-cache.sh

      - name: Install host packages
        run: scripts/ci-host-setup.sh

      - name: Release stamp
        id: stamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Prove the named packages
        env:
          ARCH: ${{ inputs.arch || 'aarch64' }}
          GTK_TARGET: gnome
          THROUGH: ${{ inputs.through || 'gtk' }}
          PACKAGES: ${{ inputs.packages || '' }}
          GH_TOKEN: ${{ github.token }}
          PROVE_PUBLISH: "1"
          PROVE_CREATED: ${{ steps.stamp.outputs.created }}
        run: |
          set -euo pipefail
          hash -r
          meson --version
          args=(--arch "$ARCH" --gtk "$GTK_TARGET" --cache "$PWD/.cache/packages")
          if [ -n "$PACKAGES" ]; then
            args+=(--packages "$PACKAGES")
          else
            args+=(--through "$THROUGH")
          fi
          scripts/prove-package.sh "${args[@]}"

      - name: Stage the pin page
        id: page
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          scripts/pins-page.sh stage --out site
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload the pin page
        if: ${{ always() && !cancelled() && steps.page.outputs.ready == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Save package cache and checkouts
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/packages
            .cache/checkouts
          key: packages-${{ inputs.arch || 'aarch64' }}-${{ github.run_id }}

      - name: Upload proved tarballs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prove-${{ inputs.arch || 'aarch64' }}
          path: out/prove/*.tar.xz
          if-no-files-found: ignore

  deploy-pins:
    needs: prove
    if: always() && needs.prove.outputs.pages == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the pin page
        id: deployment
        uses: actions/deploy-pages@v5
