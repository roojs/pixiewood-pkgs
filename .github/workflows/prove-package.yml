name: Prove package

on:
  workflow_dispatch:
    inputs:
      through:
        description: Last package to prove, from the start of build-order.txt. Cached packages whose inputs have not changed are reused. This does not publish. Run Monitor upstreams after this is green through the last package.
        type: string
        default: glib-networking
      packages:
        description: Explicit package list instead of through. Leave empty to use through.
        type: string
        default: ""
      arch:
        description: Android arch
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64
      gtk:
        description: GTK target from packages/gtk/targets. Leaf packages do not use it. gdk and gtk do.
        type: string
        default: gnome

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore package cache and checkouts
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/packages
            .cache/checkouts
          key: packages-${{ inputs.arch || 'aarch64' }}-${{ github.run_id }}
          restore-keys: |
            packages-${{ inputs.arch || 'aarch64' }}-

      - name: List restored packages
        env:
          CACHE_HIT: ${{ steps.packages.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.packages.outputs.cache-matched-key }}
        run: |
          echo "cache-hit=${CACHE_HIT:-false}"
          echo "cache-matched-key=${CACHE_MATCHED_KEY:-none}"
          scripts/list-package-cache.sh

      - name: Install host packages
        run: scripts/ci-host-setup.sh

      - name: Prove the named packages
        env:
          ARCH: ${{ inputs.arch || 'aarch64' }}
          GTK_TARGET: ${{ inputs.gtk || 'gnome' }}
          THROUGH: ${{ inputs.through || 'gtk' }}
          PACKAGES: ${{ inputs.packages || '' }}
        run: |
          set -euo pipefail
          hash -r
          meson --version
          args=(--arch "$ARCH" --gtk "$GTK_TARGET" --cache "$PWD/.cache/packages")
          if [ -n "$PACKAGES" ]; then
            args+=(--packages "$PACKAGES")
          else
            args+=(--through "$THROUGH")
          fi
          scripts/prove-package.sh "${args[@]}"

      - name: Save package cache and checkouts
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/packages
            .cache/checkouts
          key: packages-${{ inputs.arch || 'aarch64' }}-${{ github.run_id }}

      - name: Upload proved tarballs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: prove-${{ inputs.arch || 'aarch64' }}
          path: out/prove/*.tar.xz
          if-no-files-found: error
