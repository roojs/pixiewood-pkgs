name: Prove package

on:
  workflow_dispatch:
    inputs:
      through:
        description: Last package to prove, from the start of build-order.txt. Cached packages whose inputs have not changed are reused.
        type: string
        default: gtk
      packages:
        description: Explicit package list instead of through. Leave empty to use through.
        type: string
        default: ""
      arch:
        description: Android arch
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64
      gtk:
        description: GTK target from packages/gtk/targets. Leaf packages do not use it. gdk and gtk do.
        type: string
        default: gnome

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - name: Restore proved packages
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/prove
          key: prove-${{ inputs.arch || 'aarch64' }}-${{ github.run_id }}
          restore-keys: |
            prove-${{ inputs.arch || 'aarch64' }}-

      - name: Install host packages
        run: scripts/ci-host-setup.sh

      - name: Prove the named packages
        env:
          ARCH: ${{ inputs.arch || 'aarch64' }}
          GTK_TARGET: ${{ inputs.gtk || 'gnome' }}
          THROUGH: ${{ inputs.through || 'gtk' }}
          PACKAGES: ${{ inputs.packages || '' }}
        run: |
          set -euo pipefail
          hash -r
          meson --version
          args=(--arch "$ARCH" --gtk "$GTK_TARGET" --cache "$PWD/.cache/prove")
          if [ -n "$PACKAGES" ]; then
            args+=(--packages "$PACKAGES")
          else
            args+=(--through "$THROUGH")
          fi
          scripts/prove-package.sh "${args[@]}"

      - name: Save proved packages
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/prove
          key: prove-${{ inputs.arch || 'aarch64' }}-${{ github.run_id }}

      - name: Upload proved tarballs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: prove-${{ inputs.arch || 'aarch64' }}
          path: out/prove/*.tar.xz
          if-no-files-found: error
