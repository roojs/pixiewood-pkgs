name: Monitor upstreams

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      arch:
        description: Android arch
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64
      gtk:
        description: GTK target from packages/gtk/targets, or both. This distribution lists gnome.
        type: string
        default: both
      force:
        description: Rebuild these packages even when unchanged (all, or comma-separated names).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: list
        env:
          WANT: ${{ github.event.inputs.gtk || 'both' }}
        run: |
          set -euo pipefail
          mapfile -t all < <(awk 'NF && $1 !~ /^#/ { print $1 }' packages/gtk/targets)
          if [ "${#all[@]}" -eq 0 ]; then
            echo "packages/gtk/targets has no GTK targets" >&2
            exit 1
          fi
          if [ "$WANT" = both ]; then
            selected=("${all[@]}")
          else
            selected=()
            for name in "${all[@]}"; do
              if [ "$name" = "$WANT" ]; then
                selected+=("$name")
              fi
            done
            if [ "${#selected[@]}" -ne 1 ]; then
              echo "Unknown GTK target: $WANT" >&2
              printf 'Known targets:\n' >&2
              printf '  %s\n' "${all[@]}" >&2
              exit 1
            fi
          fi
          json="$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)"
          echo "names=$json" >> "$GITHUB_OUTPUT"

  plan:
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gtk: ${{ fromJson(needs.targets.outputs.names) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and compare
        id: result
        env:
          ARCH: ${{ github.event.inputs.arch || 'aarch64' }}
          FORCE: ${{ github.event.inputs.force || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gtk="${{ matrix.gtk }}"
          abi="$(awk -v arch="$ARCH" '$1 !~ /^#/ && $1 == arch { print $2; found = 1 } END { exit !found }' cross/abi)"
          scripts/upstream-index.sh resolve --gtk "$gtk" --out resolved.tsv
          if ! gh release download latest --repo "${GITHUB_REPOSITORY}" --pattern "index-${abi}-${gtk}.json" --output previous.json; then
            rm -f previous.json
          fi
          args=(plan --resolved resolved.tsv --gtk "$gtk" --out plan.tsv)
          if [ -n "$FORCE" ]; then
            args+=(--force "$FORCE")
          fi
          if [ -f previous.json ]; then
            args+=(--previous previous.json)
          fi
          scripts/upstream-index.sh "${args[@]}"
          publish="$(sed -n 's/^# publish=//p' plan.tsv)"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.result.outputs.publish == '1'
        with:
          name: upstream-plan-${{ matrix.gtk }}
          path: |
            plan.tsv
            resolved.tsv

  pins:
    needs: [targets, plan]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.record.outputs.sha }}
      created: ${{ steps.record.outputs.created }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: upstream-plan-*
          path: plans

      - name: Record the release stamp
        id: record
        run: |
          set -euo pipefail
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sha="$(git rev-parse HEAD)"
          scripts/place-upstream-plans.sh plans
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

  publish:
    needs: [targets, plan, pins]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pins.outputs.sha }}
          fetch-depth: 0

      - name: Restore package cache and checkouts
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/packages
            .cache/checkouts
          key: packages-${{ github.event.inputs.arch || 'aarch64' }}-${{ github.run_id }}
          restore-keys: |
            packages-${{ github.event.inputs.arch || 'aarch64' }}-

      - name: List restored packages
        env:
          CACHE_HIT: ${{ steps.packages.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.packages.outputs.cache-matched-key }}
        run: |
          echo "cache-hit=${CACHE_HIT:-false}"
          echo "cache-matched-key=${CACHE_MATCHED_KEY:-none}"
          scripts/list-package-cache.sh

      - uses: actions/download-artifact@v7
        id: plan
        continue-on-error: true
        with:
          pattern: upstream-plan-*
          path: plans

      - name: Build the GTK targets in packages/gtk/targets
        env:
          ARCH: ${{ github.event.inputs.arch || 'aarch64' }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.pins.outputs.sha }}
          RELEASE_CREATED: ${{ needs.pins.outputs.created }}
        run: |
          set -euo pipefail
          scripts/place-upstream-plans.sh plans
          shopt -s nullglob
          mkdir -p out/packages
          need_host=0
          for plan in plans/upstream-plan-*/plan.tsv; do
            if grep -q '^# build=1$' "$plan"; then
              need_host=1
            fi
          done
          if [ "$need_host" -eq 1 ]; then
            scripts/ci-host-setup.sh
            hash -r
            meson --version
          fi
          seen="$(mktemp)"
          while IFS= read -r gtk; do
            plan="plans/upstream-plan-${gtk}/plan.tsv"
            [ -f "$plan" ] || continue
            printf '%s\n' "$plan" >> "$seen"
            grep -q '^# publish=1$' "$plan" || continue
            echo "Publishing $gtk"
            built="plans/upstream-plan-${gtk}/build.tsv"
            scripts/current-pins.sh apply --plan "$plan" --arch "$ARCH" --out "$built"
            if grep -q $'^build\t' "$built"; then
              scripts/build-changed.sh \
                --plan "$built" \
                --arch "$ARCH" \
                --gtk "$gtk" \
                --cache "$PWD/.cache/packages" \
                --tarball-dir "$PWD/out/packages"
            fi
            scripts/publish-index.sh \
              --plan "$built" \
              --tarball-dir out/packages \
              --arch "$ARCH" \
              --gtk "$gtk" \
              --created "$RELEASE_CREATED" \
              --out "out/index-${gtk}.json"
          done < <(awk 'NF && $1 !~ /^#/ { print $1 }' packages/gtk/targets)
          for plan in plans/upstream-plan-*/plan.tsv; do
            if ! grep -qx "$plan" "$seen"; then
              echo "Downloaded plan was not published: $plan" >&2
              exit 1
            fi
          done

      - name: Publish packages that finished
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.pins.outputs.sha }}
          RELEASE_CREATED: ${{ needs.pins.outputs.created }}
          ARCH: ${{ github.event.inputs.arch || 'aarch64' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          abi="$(awk -v arch="$ARCH" '$1 == arch { print $2; exit }' cross/abi)"
          shopt -s nullglob
          for built in plans/upstream-plan-*/build.tsv; do
            gtk="$(sed -n 's/^# gtk_target=//p' "$built" | head -n1)"
            [ -n "$gtk" ] || continue
            while IFS=$'\t' read -r status name _kind track resolved inputs _url; do
              [ -n "${status:-}" ] || continue
              case "$status" in \#*) continue ;; esac
              [ "$status" = build ] || continue
              tarball="out/packages/${name}-${abi}.tar.xz"
              [ -f "$tarball" ] || continue
              scripts/publish-package.sh \
                --name "$name" \
                --tarball "$tarball" \
                --arch "$ARCH" \
                --gtk "$gtk" \
                --track "$track" \
                --resolved "$resolved" \
                --inputs "$inputs" \
                --created "$RELEASE_CREATED" \
                --commit
            done < "$built"
          done

      - name: Save package cache and checkouts
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/packages
            .cache/checkouts
          key: packages-${{ github.event.inputs.arch || 'aarch64' }}-${{ github.run_id }}
