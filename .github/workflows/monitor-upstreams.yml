name: Monitor upstreams

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      arch:
        description: Android arch
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64
      force:
        description: Rebuild these packages even when unchanged (all, or comma-separated names).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: list
        run: |
          set -euo pipefail
          mapfile -t all < <(awk 'NF && $1 !~ /^#/ { print $1 }' packages/gtk/targets)
          if [ "${#all[@]}" -eq 0 ]; then
            echo "packages/gtk/targets is empty" >&2
            exit 1
          fi
          json="$(printf '%s\n' "${all[@]}" | jq -R . | jq -sc .)"
          echo "names=$json" >> "$GITHUB_OUTPUT"

  update-wraps:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.done.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Move wraps to the newest release on their version line
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          scripts/update-wraps.sh

      - name: Commit wrap updates
        id: done
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update wraps to the newest release on each version line."
            git pull --rebase origin main
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: [targets, update-wraps]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gtk: ${{ fromJson(needs.targets.outputs.names) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.update-wraps.outputs.sha }}
          fetch-depth: 0

      - name: Use the published pin lists
        run: scripts/pins-page.sh fetch

      - name: Resolve and compare
        id: result
        env:
          ARCH: ${{ github.event.inputs.arch || 'aarch64' }}
          FORCE: ${{ github.event.inputs.force || '' }}
        run: |
          set -euo pipefail
          gtk="${{ matrix.gtk }}"
          abi="$(awk -v arch="$ARCH" '$1 !~ /^#/ && $1 == arch { print $2; found = 1 } END { exit !found }' cross/abi)"
          scripts/upstream-index.sh resolve --gtk "$gtk" --out resolved.tsv
          if ! scripts/current-pins.sh previous --abi "$abi" --gtk "$gtk" --out previous.json; then
            rm -f previous.json
          fi
          args=(plan --resolved resolved.tsv --gtk "$gtk" --abi "$abi" --out plan.tsv)
          if [ -n "$FORCE" ]; then
            args+=(--force "$FORCE")
          fi
          if [ -f previous.json ]; then
            args+=(--previous previous.json)
          fi
          scripts/upstream-index.sh "${args[@]}"
          publish="$(sed -n 's/^# publish=//p' plan.tsv)"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.result.outputs.publish == '1'
        with:
          name: upstream-plan-${{ matrix.gtk }}
          path: |
            plan.tsv
            resolved.tsv

  pins:
    needs: [targets, plan, update-wraps]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.record.outputs.sha }}
      created: ${{ steps.record.outputs.created }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.update-wraps.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: upstream-plan-*
          path: plans

      - name: Record the release stamp
        id: record
        run: |
          set -euo pipefail
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sha="$(git rev-parse HEAD)"
          scripts/place-upstream-plans.sh plans
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

  publish:
    needs: [targets, plan, pins]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: write
      contents: write
    outputs:
      pages: ${{ steps.page.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pins.outputs.sha }}
          fetch-depth: 0

      - name: Use the published pin lists
        run: scripts/pins-page.sh fetch

      - name: Restore package cache and checkouts
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/packages
            .cache/checkouts
          key: packages-${{ github.event.inputs.arch || 'aarch64' }}-${{ github.run_id }}
          restore-keys: |
            packages-${{ github.event.inputs.arch || 'aarch64' }}-

      - name: List restored packages
        env:
          CACHE_HIT: ${{ steps.packages.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.packages.outputs.cache-matched-key }}
        run: |
          echo "cache-hit=${CACHE_HIT:-false}"
          echo "cache-matched-key=${CACHE_MATCHED_KEY:-none}"
          scripts/list-package-cache.sh

      - uses: actions/download-artifact@v7
        id: plan
        continue-on-error: true
        with:
          pattern: upstream-plan-*
          path: plans

      - name: Build the libraries in build-order.txt
        env:
          ARCH: ${{ github.event.inputs.arch || 'aarch64' }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.pins.outputs.sha }}
          RELEASE_CREATED: ${{ needs.pins.outputs.created }}
        run: |
          set -euo pipefail
          scripts/place-upstream-plans.sh plans
          shopt -s nullglob
          mkdir -p out/packages
          seen="$(mktemp)"
          host_ready=0
          while IFS= read -r gtk; do
            plan="plans/upstream-plan-${gtk}/plan.tsv"
            [ -f "$plan" ] || continue
            printf '%s\n' "$plan" >> "$seen"
            publish_plan=0
            if grep -q '^# publish=1$' "$plan"; then
              publish_plan=1
            fi
            built="plans/upstream-plan-${gtk}/build.tsv"
            scripts/current-pins.sh apply --plan "$plan" --arch "$ARCH" --out "$built"
            scripts/build-changed.sh \
              --missing-only \
              --plan "$built" \
              --arch "$ARCH" \
              --gtk "$gtk" \
              --tarball-dir "$PWD/out/packages"
            if ! grep -q $'^build\t' "$built" && [ "$publish_plan" -eq 0 ]; then
              continue
            fi
            echo "Publishing $gtk"
            if grep -q $'^build\t' "$built"; then
              if [ "$host_ready" -eq 0 ]; then
                scripts/ci-host-setup.sh
                hash -r
                meson --version
                host_ready=1
              fi
              scripts/build-changed.sh \
                --skip-missing-check \
                --plan "$built" \
                --arch "$ARCH" \
                --gtk "$gtk" \
                --cache "$PWD/.cache/packages" \
                --tarball-dir "$PWD/out/packages"
            fi
            scripts/publish-index.sh \
              --plan "$built" \
              --tarball-dir out/packages \
              --arch "$ARCH" \
              --gtk "$gtk" \
              --created "$RELEASE_CREATED"
          done < <(awk 'NF && $1 !~ /^#/ { print $1 }' packages/gtk/targets)
          for plan in plans/upstream-plan-*/plan.tsv; do
            if ! grep -qx "$plan" "$seen"; then
              echo "Downloaded plan was not published: $plan" >&2
              exit 1
            fi
          done

      - name: Publish packages that finished
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.pins.outputs.sha }}
          RELEASE_CREATED: ${{ needs.pins.outputs.created }}
          ARCH: ${{ github.event.inputs.arch || 'aarch64' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          abi="$(awk -v arch="$ARCH" '$1 == arch { print $2; exit }' cross/abi)"
          shopt -s nullglob
          if [ -n "$(git status --porcelain -- failures.tsv)" ]; then
            git add failures.tsv
            git commit -m "Remember a library version that did not build."
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          for built in plans/upstream-plan-*/build.tsv; do
            gtk="$(sed -n 's/^# gtk_target=//p' "$built" | head -n1)"
            [ -n "$gtk" ] || continue
            while IFS=$'\t' read -r status name _kind track resolved inputs _url; do
              [ -n "${status:-}" ] || continue
              case "$status" in \#*) continue ;; esac
              [ "$status" = build ] || continue
              tarball="out/packages/${name}-${abi}.tar.xz"
              [ -f "$tarball" ] || continue
              scripts/publish-package.sh \
                --name "$name" \
                --tarball "$tarball" \
                --arch "$ARCH" \
                --gtk "$gtk" \
                --track "$track" \
                --resolved "$resolved" \
                --inputs "$inputs" \
                --created "$RELEASE_CREATED"
            done < "$built"
          done

      - name: Stage the pin page
        id: page
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          scripts/pins-page.sh stage --out site
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload the pin page
        if: ${{ always() && !cancelled() && steps.page.outputs.ready == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Save package cache and checkouts
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/packages
            .cache/checkouts
          key: packages-${{ github.event.inputs.arch || 'aarch64' }}-${{ github.run_id }}

  deploy-pins:
    needs: publish
    if: always() && needs.publish.outputs.pages == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the pin page
        id: deployment
        uses: actions/deploy-pages@v5
