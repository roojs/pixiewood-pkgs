name: Monitor upstreams

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      arch:
        description: Android arch
        type: choice
        options:
          - aarch64
          - x86_64
        default: aarch64
      gtk:
        description: GTK target from packages/gtk/targets, or both. A branch target is owner.branch, for example Knowles.android-ime.
        type: string
        default: both
      force:
        description: Rebuild these packages even when unchanged (all, or comma-separated names).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v6

      - id: list
        env:
          WANT: ${{ github.event.inputs.gtk || 'both' }}
        run: |
          set -euo pipefail
          mapfile -t all < <(awk 'NF && $1 !~ /^#/ { print $1 }' packages/gtk/targets)
          if [ "${#all[@]}" -eq 0 ]; then
            echo "packages/gtk/targets has no GTK targets" >&2
            exit 1
          fi
          if [ "$WANT" = both ]; then
            selected=("${all[@]}")
          else
            selected=()
            for name in "${all[@]}"; do
              if [ "$name" = "$WANT" ]; then
                selected+=("$name")
              fi
            done
            if [ "${#selected[@]}" -ne 1 ]; then
              echo "Unknown GTK target: $WANT" >&2
              printf 'Known targets:\n' >&2
              printf '  %s\n' "${all[@]}" >&2
              exit 1
            fi
          fi
          json="$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc .)"
          echo "names=$json" >> "$GITHUB_OUTPUT"

  plan:
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gtk: ${{ fromJson(needs.targets.outputs.names) }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve and compare
        id: result
        env:
          ARCH: ${{ github.event.inputs.arch || 'aarch64' }}
          FORCE: ${{ github.event.inputs.force || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gtk="${{ matrix.gtk }}"
          abi="$(awk -v arch="$ARCH" '$1 !~ /^#/ && $1 == arch { print $2; found = 1 } END { exit !found }' cross/abi)"
          scripts/upstream-index.sh resolve --gtk "$gtk" --out resolved.tsv
          if ! gh release download latest --repo "${GITHUB_REPOSITORY}" --pattern "index-${abi}-${gtk}.json" --output previous.json; then
            rm -f previous.json
          fi
          args=(plan --resolved resolved.tsv --gtk "$gtk" --out plan.tsv)
          if [ -n "$FORCE" ]; then
            args+=(--force "$FORCE")
          fi
          if [ -f previous.json ]; then
            args+=(--previous previous.json)
          fi
          scripts/upstream-index.sh "${args[@]}"
          publish="$(sed -n 's/^# publish=//p' plan.tsv)"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.result.outputs.publish == '1'
        with:
          name: upstream-plan-${{ matrix.gtk }}
          path: |
            plan.tsv
            resolved.tsv

  publish:
    needs: [targets, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        gtk: ${{ fromJson(needs.targets.outputs.names) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        id: plan
        continue-on-error: true
        with:
          name: upstream-plan-${{ matrix.gtk }}
          path: plan

      - name: Install host packages
        if: steps.plan.outcome == 'success'
        run: |
          if ! grep -q '^# build=1$' plan/plan.tsv; then
            echo "Index-only update"
            exit 0
          fi
          scripts/ci-host-setup.sh

      - name: Build changed packages
        if: steps.plan.outcome == 'success'
        env:
          ARCH: ${{ github.event.inputs.arch || 'aarch64' }}
        run: |
          if ! grep -q '^# build=1$' plan/plan.tsv; then
            mkdir -p out/packages
            exit 0
          fi
          scripts/build-changed.sh \
            --plan plan/plan.tsv \
            --arch "$ARCH" \
            --gtk "${{ matrix.gtk }}" \
            --tarball-dir "$PWD/out/packages"

      - name: Publish index
        if: steps.plan.outcome == 'success'
        env:
          ARCH: ${{ github.event.inputs.arch || 'aarch64' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/packages
          scripts/publish-index.sh \
            --plan plan/plan.tsv \
            --tarball-dir out/packages \
            --arch "$ARCH" \
            --gtk "${{ matrix.gtk }}" \
            --out out/index.json
